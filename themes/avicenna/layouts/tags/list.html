{{ define "main" }}
<div class="prose">
    {{ partial "blog/blog_navbar.html" (dict "showAll" true) }}
    <h1>Posts tagged #{{ .Data.Term }}</h1>

    {{ range .Pages.ByPublishDate.Reverse }}
    <article class="post">
        {{ partial "blog/blog_post_header.html" . }}
        {{ partial "blog/blog_post_body.html" . }}
    </article>
    {{ end }}
</div>
{{ end }}
