{{ $about := .Site.GetPage .Params.content_type }}

{{ with $about.Content }}<div class="bio">{{ . }}</div>{{ end }}

{{/* The Currently block stays hidden until `currently` is filled in on content/about/_index.md. */}}
{{ with $about.Params.currently }}
<div class="now">
    <div class="now__cap"><span class="now__dot"></span>Currently</div>
    <div class="now__body">{{ . | markdownify }}</div>
</div>
{{ end }}
