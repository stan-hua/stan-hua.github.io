{{ $readTime := math.Ceil (div (countwords .Content) 220.0) }}

<h2 class="post__title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>

<div class="post__meta">
    {{ .Date | time.Format "Jan 2, 2006" }} &middot; {{ $readTime }} min read
</div>

{{ with .Params.tags }}
<div class="post__tags">
    {{ range . }}<a class="tag" href="{{ (printf "/tags/%s/" (urlize .)) | relURL }}">#{{ . }}</a>{{ end }}
</div>
{{ end }}
