baseURL = "https://stan-hua.github.io/"

# set your your own ga token here.
googleAnalytics = ""

languageCode = "en-us"

# for using avicenna you need to set the themes to 'avicenna'
enableEmoji = true
theme = "avicenna"

# This is your page title, it appears in your tab
title = "Stanley Z. Hua"

# number of posts to show on the blog page
paginate = 10

# only `tags` is used (by blog posts); drop Hugo's default `categories` taxonomy,
# which was generating empty pages nothing linked to
[taxonomies]
tag = "tags"

[markup]
[markup.tableOfContents]
endLevel = 3
ordered = false
startLevel = 1

[markup.goldmark]
  [markup.goldmark.renderer]
    unsafe = true

[params]
# used in the footer copyright line
name = "Stanley Hua"
# author name to emphasise in publication author lists; must match the spelling used
# in each publication's `authors` list
author = "Stanley Hua"
